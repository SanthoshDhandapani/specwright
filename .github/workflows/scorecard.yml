name: OpenSSF Scorecard

on:
  # Weekly scan — catches drift even without code changes
  schedule:
    - cron: "0 9 * * 1"
  # Scan every push to main
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # upload SARIF to Security tab
      id-token: write           # publish results to OpenSSF API

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to public OpenSSF API so your score appears on
          # https://scorecard.dev/viewer/?uri=github.com/SanthoshDhandapani/specwright
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
