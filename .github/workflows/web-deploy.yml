name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.SPECWRIGHT_WEB_VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Plain `vercel deploy` uploads source and lets Vercel's native build
      # infrastructure compile it. We don't use `vercel build --prebuilt`
      # because the CLI's `vercel build` auto-injects
      # outputFileTracingRoot=apps/web, which conflicts with our explicit
      # turbopack.root and breaks Turbopack's pnpm-monorepo resolution.
      # Vercel's native build pipeline handles the monorepo correctly.
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
